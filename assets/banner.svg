<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>

    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#text-gradient);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #F8FAFC;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #38BDF8;
    }
    .card-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #94A3B8;
    }

    /* CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .anim-float-1 { animation: floatSlow 5s ease-in-out infinite; }
    .anim-float-2 { animation: floatReverse 6s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8 6; animation: dashMove 20s linear infinite; }
    .anim-fade { animation: fadeIn 1s ease-out forwards; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-gradient)"/>

  <!-- Background Decorative Grid & Glowing Orbs -->
  <g opacity="0.15">
    <circle cx="150" cy="80" r="180" fill="#00F2FE" class="anim-pulse"/>
    <circle cx="1050" cy="260" r="220" fill="#7F00FF" class="anim-pulse"/>
  </g>

  <!-- Grid Pattern overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,340 M 300,0 L 300,340 M 450,0 L 450,340 M 600,0 L 600,340 M 750,0 L 750,340 M 900,0 L 900,340 M 1050,0 L 1050,340" />
  </g>

  <!-- Dynamic Connecting Network Nodes (Background Element) -->
  <g stroke="url(#accent-cyan)" stroke-width="1.5" opacity="0.4" class="anim-dash">
    <path d="M 80,260 Q 200,180 320,240 T 560,200" fill="none"/>
    <path d="M 700,100 Q 850,160 980,90 T 1140,180" fill="none"/>
  </g>

  <!-- Background Dynamic Floating Cards (Positioned to sides so center foreground is clear) -->
  <!-- Left Background Card -->
  <g class="anim-float-1" opacity="0.85">
    <rect x="45" y="45" width="210" height="75" rx="12" fill="url(#card-gradient)" stroke="#334155" stroke-width="1"/>
    <circle cx="70" cy="82" r="14" fill="url(#accent-cyan)" opacity="0.2"/>
    <text x="70" y="87" text-anchor="middle" fill="#00F2FE" font-size="14" font-weight="bold">⚖️</text>
    <text x="96" y="75" class="card-title">Bias Audit 99.4%</text>
    <text x="96" y="93" class="card-sub">Demographic Parity</text>
  </g>

  <!-- Right Background Card 1 -->
  <g class="anim-float-2" opacity="0.85">
    <rect x="945" y="45" width="210" height="75" rx="12" fill="url(#card-gradient)" stroke="#334155" stroke-width="1"/>
    <circle cx="970" cy="82" r="14" fill="url(#accent-purple)" opacity="0.2"/>
    <text x="970" y="87" text-anchor="middle" fill="#E100FF" font-size="14" font-weight="bold">🧠</text>
    <text x="996" y="75" class="card-title">SHAP &amp; LIME XAI</text>
    <text x="996" y="93" class="card-sub">Local Feature Attribution</text>
  </g>

  <!-- Right Background Card 2 -->
  <g class="anim-float-1" opacity="0.85">
    <rect x="945" y="215" width="210" height="75" rx="12" fill="url(#card-gradient)" stroke="#334155" stroke-width="1"/>
    <circle cx="970" cy="252" r="14" fill="url(#accent-cyan)" opacity="0.2"/>
    <text x="970" y="257" text-anchor="middle" fill="#00F2FE" font-size="14" font-weight="bold">🛡️</text>
    <text x="996" y="245" class="card-title">EU AI Act Ready</text>
    <text x="996" y="263" class="card-sub">NIST RMF &amp; ISO 42001</text>
  </g>

  <!-- Left Background Card 2 -->
  <g class="anim-float-2" opacity="0.85">
    <rect x="45" y="215" width="210" height="75" rx="12" fill="url(#card-gradient)" stroke="#334155" stroke-width="1"/>
    <circle cx="70" cy="252" r="14" fill="url(#accent-purple)" opacity="0.2"/>
    <text x="70" y="257" text-anchor="middle" fill="#E100FF" font-size="14" font-weight="bold">📊</text>
    <text x="96" y="245" class="card-title">LLM Red Teaming</text>
    <text x="96" y="263" class="card-sub">Continuous Observability</text>
  </g>

  <!-- Main Center Foreground Elements (High Contrast & Unobscured) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Central Icon/Logo Glow Badge -->
    <g transform="translate(600, 75)">
      <rect x="-36" y="-36" width="72" height="72" rx="20" fill="url(#card-gradient)" stroke="url(#accent-cyan)" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" font-size="34">🤖</text>
    </g>

    <!-- Title -->
    <text x="600" y="175" class="title-text">Awesome ML Bias Detection &amp; Explainability</text>
    
    <!-- Subtitle -->
    <text x="600" y="212" class="subtitle-text">Curated Enterprise SaaS Platforms &amp; Open-Source XAI Frameworks</text>

    <!-- Foreground Feature Pills -->
    <g transform="translate(600, 268)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="url(#accent-cyan)" opacity="0.2" stroke="#00F2FE" stroke-width="1"/>
        <text x="0" y="5" class="badge-text">🔍 Explainable AI (XAI)</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="url(#accent-purple)" opacity="0.2" stroke="#E100FF" stroke-width="1"/>
        <text x="0" y="5" class="badge-text">⚖️ Fairness Audits</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(230, 0)">
        <rect x="-90" y="-16" width="180" height="32" rx="16" fill="url(#accent-cyan)" opacity="0.2" stroke="#00F2FE" stroke-width="1"/>
        <text x="0" y="5" class="badge-text">🛡️ Governance &amp; GRC</text>
      </g>
    </g>
  </g>
</svg>
